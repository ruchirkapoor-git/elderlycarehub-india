<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elderly Care Hub India</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.page{width:80%;max-width:1100px;min-width:560px;margin:0 auto;padding:1.5rem 0 3rem}

/* Centralized Header with 10% margins on either side */
.topbar-header{margin:0 10% 2.2rem;text-align:center}
.brand-label{font-size:13px;letter-spacing:0.12em;color:#1D9E75;font-weight:500;text-transform:uppercase;margin-bottom:8px}
.brand h1{font-size:34px;font-weight:600;color:var(--color-text-primary);line-height:1.2;margin-bottom:6px}
.brand p{font-size:16px;color:var(--color-text-secondary)}

.topbar{display:flex;align-items:center;justify-content:center;margin-bottom:1.8rem}
.top-selectors{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.sel-grp{display:flex;flex-direction:column;gap:4px;text-align:left}
.sel-grp label{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:0.08em}
.sel-grp select{font-size:13px;min-width:140px}

.hero-strip{background:#085041;border-radius:16px;padding:1rem 1.5rem;margin-bottom:1.8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.hero-stats{display:flex;gap:2rem}
.hs-num{font-size:22px;font-weight:500;color:#fff}
.hs-lbl{font-size:11px;color:#5DCAA5}
.hero-helplines{display:flex;gap:10px;flex-wrap:wrap}
.hl{background:rgba(255,255,255,0.08);border:0.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:7px 12px;display:flex;align-items:center;gap:8px}
.hl-ic{font-size:14px;color:#5DCAA5}
.hl-num{font-size:13px;font-weight:500;color:#fff}
.hl-lbl{font-size:10px;color:#9FE1CB}

.search-pill-row{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;flex-wrap:wrap}
.search-wrap{display:flex;flex:1;min-width:200px;gap:8px}
.search-wrap input{flex:1;font-size:13px}
.ai-btn{font-size:12px;padding:0 14px;height:36px;white-space:nowrap;background:#085041;color:#fff;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:5px}
.ai-btn:hover{background:#0F6E56}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pill:hover{background:var(--color-background-secondary)}
.pill.on{background:#085041;color:#fff;border-color:#085041}

.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-icon{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px}
.si-loc{background:#FAEEDA;color:#633806}
.si-nat{background:#E6F1FB;color:#185FA5}
.sec-title{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.cnt{font-size:11px;padding:2px 9px;border-radius:9px;font-weight:500}
.cnt-loc{background:#FAEEDA;color:#633806}
.cnt-nat{background:#E6F1FB;color:#0C447C}
.sec-sub{font-size:12px;color:var(--color-text-secondary)}

.divider{border:none;border-top:0.5px solid var(--color-border-tertiary);margin:2rem 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px;margin-bottom:0.5rem}

.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:12px;padding:1rem 1.1rem;transition:border-color 0.15s}
.card:hover{border-color:var(--color-border-secondary)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
